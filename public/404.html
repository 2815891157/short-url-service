<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - 链接不存在</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .error-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      text-align: center;
      padding: 40px;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: var(--border-color);
      line-height: 1;
    }
    .error-icon {
      font-size: 3rem;
      color: var(--danger);
      margin: 16px 0;
    }
    .error-msg {
      font-size: 1.1rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
  <div class="error-page">
    <div class="error-code">404</div>
    <div class="error-icon"><i class="ph ph-link-break"></i></div>
    <div class="error-msg">该短链接不存在或已被删除</div>
    <a href="/" class="btn btn-primary">
      <i class="ph ph-house"></i> 返回首页
    </a>
  </div>
</body>
</html>
